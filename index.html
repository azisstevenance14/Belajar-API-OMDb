<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSA Movie Search App 🎬</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- Header / Navbar Sederhana -->
    <nav class="navbar navbar-dark bg-black shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold text-danger">🎬 ASSA Movie App</span>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container my-4">
        
        <!-- Form Pencarian -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Cari judul film (contoh: Batman, Naruto)...">
                    <button class="btn btn-danger" type="button" id="searchBtn">Cari Film</button>
                </div>
            </div>
        </div>

        <!-- Area Loading / Pesan Error -->
        <div id="messageArea" class="text-center text-muted mb-4"></div>

        <!-- Wadah Daftar Kartu Film (Hasil Fetch API) -->
        <div class="row" id="movieContainer">
            <!-- Kartu film akan dicetak secara dinamis lewat JavaScript di sini -->
        </div>

    </div>

    <!-- JavaScript Kita -->
    <script src="script.js"></script>
</body>
</html>
